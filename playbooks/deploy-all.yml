---
# deploy-all.yml — Deploy all services in dependency order
# This is the main playbook Semaphore runs for a full deployment.
# Each play targets a different host group for proper inventory resolution.

- name: "Phase 1: Deploy OpenBao (secrets backbone)"
  hosts: openbao
  gather_facts: false
  tasks:
    - name: Run OpenBao deploy.sh
      ansible.builtin.shell: |
        cd "{{ deploy_dir }}"
        bash deploy.sh
      register: result
      changed_when: true
    - name: Show output
      ansible.builtin.debug:
        var: result.stdout_lines

- name: "Phase 2: Deploy data & automation services (parallel-safe)"
  hosts: nocodb:n8n:semaphore_svc
  gather_facts: false
  strategy: free
  tasks:
    - name: "Run {{ service_name }} deploy.sh"
      ansible.builtin.shell: |
        cd "{{ deploy_dir }}"
        bash deploy.sh
      environment:
        OPENBAO_ADDR: "{{ openbao_addr | default('http://192.168.1.164:8200') }}"
      register: result
      changed_when: true
    - name: Show output
      ansible.builtin.debug:
        var: result.stdout_lines

- name: "Phase 3: Deploy NetBox (infrastructure modeling)"
  hosts: netbox
  gather_facts: false
  tasks:
    - name: Run NetBox deploy.sh
      ansible.builtin.shell: |
        cd "{{ deploy_dir }}"
        bash deploy.sh
      environment:
        OPENBAO_ADDR: "{{ openbao_addr | default('http://192.168.1.164:8200') }}"
      register: result
      changed_when: true
      ignore_errors: true
    - name: Show output
      ansible.builtin.debug:
        var: result.stdout_lines

- name: "Phase 4: Deploy NemoClaw (AI agent)"
  hosts: nemoclaw
  gather_facts: false
  tasks:
    - name: Run NemoClaw deploy.sh
      ansible.builtin.shell: |
        cd "{{ deploy_dir }}"
        bash deploy.sh
      environment:
        OPENBAO_ADDR: "{{ openbao_addr | default('http://192.168.1.164:8200') }}"
      register: result
      changed_when: true
      ignore_errors: true
    - name: Show output
      ansible.builtin.debug:
        var: result.stdout_lines
