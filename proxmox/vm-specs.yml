# VM resource specifications for workflow-agents infrastructure
# Used by Ansible playbooks and provisioning scripts
# Tags are applied to Proxmox VMs automatically by provision-vm.yml

template:
  vmid: 9000
  name: 2cpu-2gbram-ubuntu24.04-template
  node: alphacentauri
  cores: 2
  memory: 2048          # MB
  disk: 20G
  disk_storage: vm-lvms
  iso: "SharedISOs:iso/ubuntu-24.04.3-live-server-amd64.iso"
  net_bridge: vmbr0

vms:
  openbao:
    vmid: 210
    name: openbao
    node: alphacentauri
    cores: 2
    memory: 2048
    disk: 20G
    ip: 192.168.1.164
    tags: "ubuntu;24.04;openbao;secrets;credentials;security"
    services:
      - "OpenBao :8200"
    runtime: podman

  nocodb:
    vmid: 205
    name: nocodb
    node: alphacentauri
    cores: 3
    memory: 6144
    disk: 32G
    ip: 192.168.1.161
    tags: "ubuntu;24.04;nocodb;database;api;bizascode;projects"
    services:
      - "NocoDB :8181"
      - "Postgres (internal)"
    runtime: podman

  n8n:
    vmid: 208
    name: n8n
    node: apollo
    cores: 4
    memory: 4096
    disk: 32G
    ip: 192.168.1.118
    tags: "ubuntu;24.04;n8n;automation;workflows;bizascode"
    services:
      - "n8n :5678"
      - "n8n Worker (internal)"
      - "Postgres (internal)"
      - "Redis (internal)"
    runtime: podman

  semaphore:
    vmid: 203
    name: semaphore
    node: apollo
    cores: 4
    memory: 8192
    disk: 32G
    ip: 192.168.1.117
    tags: "ubuntu;24.04;semaphore;automation;ansible;foundations"
    services:
      - "Semaphore :3000"
      - "Postgres (internal)"
    runtime: podman

  nemoclaw:
    vmid: 209
    name: nemoclaw
    node: andromeda
    cores: 6
    memory: 16384
    disk: 48G
    ip: 192.168.1.163
    tags: "ubuntu;24.04;nemoclaw;ai;agent;docker"
    services:
      - "NemoClaw + OpenShell"
    runtime: docker

  netbox:
    vmid: 202
    name: netbox
    node: mercier77
    cores: 4
    memory: 8192
    disk: 32G
    ip: 192.168.1.116
    tags: "ubuntu;24.04;netbox;ipam;dcim;foundations;networking"
    services:
      - "NetBox :8000"
      - "Diode Pipeline"
    runtime: podman

# Network defaults
defaults:
  gateway: 192.168.1.1
  nameserver: 192.168.1.1
  netmask: 24
  net_bridge: vmbr0
  disk_storage: vm-lvms
  iso_storage: SharedISOs
  ssh_user: uhstray
  ssh_key_file: proxmox/secrets/uhstray_ed25519.pub
  base_tags: "ubuntu;24.04"
